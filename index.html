<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro de Carrera</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Evita zooms molestos por doble clic rápido en móviles */
        button { touch-action: manipulation; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col p-4">

    <main class="max-w-md mx-auto w-full flex-grow flex flex-col justify-between space-y-4">
        
        <div class="bg-gray-800 p-4 rounded-xl shadow-lg text-center flex flex-col items-center justify-center space-y-3">
            
            <img src="logo.png" alt="Logo Institucional" class="h-20 w-auto object-contain drop-shadow-md">
            
            <div>
                <h1 class="text-xl font-extrabold tracking-wider text-blue-400 uppercase">
                    Evaluación Física
                </h1>
                <p class="text-xs text-gray-400 font-semibold tracking-widest uppercase mt-0.5">
                    Control de Tiempos
                </p>
            </div>

            <hr class="w-full border-gray-700 my-1">
            
            <button id="btn-inicio" onclick="iniciarCarrera()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-all text-base tracking-wide">
                🚀 INICIAR LARGADA
            </button>
            
            <div id="status-inicio" class="text-sm text-gray-400 italic">Carrera no iniciada</div>
        </div>

        <div class="flex-grow flex items-center justify-center">
            <button id="btn-llegada" onclick="marcarLlegada()" disabled class="w-full h-64 bg-blue-600 hover:bg-blue-500 active:bg-blue-800 disabled:bg-gray-700 disabled:opacity-50 text-white font-extrabold text-3xl rounded-2xl shadow-2xl transition-all border-4 border-blue-400 active:scale-95 flex items-center justify-center">
                ⏱️ ¡LLEGADA!
            </button>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl shadow-lg flex flex-col h-48">
            <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
                <span class="font-semibold text-gray-300">Últimos registros (<span id="contador">0</span>)</span>
                <button onclick="limpiarLocal()" class="text-xs text-red-400 hover:text-red-300">Borrar todo</button>
            </div>
            <div id="lista-tiempos" class="overflow-y-auto flex-grow space-y-1 text-sm font-mono text-gray-300">
                <div class="text-center text-gray-500 italic mt-4">No hay tiempos marcados aún.</div>
            </div>
        </div>

        <div class="pb-4">
            <button id="btn-sincro" onclick="sincronizarConSheet()" class="w-full bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-gray-900 font-bold py-3 px-4 rounded-lg shadow transition-all flex items-center justify-center gap-2 text-base">
                🔄 SINCRONIZAR CON GOOGLE SHEET
            </button>
        </div>

    </main>

    <script>
        // ==========================================
        // VOLVÉ A PEGAR TU URL DE GOOGLE APPS SCRIPT ACÁ (LA QUE TERMINA EN /exec)
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxRxzyh0X3XyL9OOD3xqiAMdZWDHHTWS-6Wjl39t2UG_RykH71HbhvgWoD5MpnLDdf-AQ/exec"; 
        // ==========================================

        let horaInicioLocal = null;
        let tiemposRegistrados = [];

        function iniciarCarrera() {
            if (horaInicioLocal) return;
            
            horaInicioLocal = new Date();
            
            document.getElementById("status-inicio").innerText = "Corriendo desde: " + horaInicioLocal.toLocaleTimeString();
            document.getElementById("status-inicio").classList.remove("text-gray-400");
            document.getElementById("status-inicio").classList.add("text-emerald-400", "font-bold");
            
            document.getElementById("btn-inicio").disabled = true;
            document.getElementById("btn-inicio").classList.add("opacity-50", "cursor-not-allowed");
            
            document.getElementById("btn-llegada").disabled = false;

            try {
                fetch(URL_WEB_APP, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        accion: "iniciar",
                        horaInicio: horaInicioLocal.toISOString()
                    })
                });
            } catch(e) {
                console.log("Error de red diferido: ", e);
            }
        }

        function marcarLlegada() {
            if (!horaInicioLocal) return;
            
            const horaActual = new Date();
            const diferenciaMs = horaActual - horaInicioLocal;
            
            const totalSegundos = Math.floor(diferenciaMs / 1000);
            const horas = Math.floor(totalSegundos / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((totalSegundos % 3600) / 60).toString().padStart(2, '0');
            const segundos = (totalSegundos % 60).toString().padStart(2, '0');
            
            const tiempoFormateado = `${horas}:${minutes}:${segundos}`;
            
            tiemposRegistrados.unshift(tiempoFormateado);
            renderizarListaLocal();
        }

        function renderizarListaLocal() {
            const contenedor = document.getElementById("lista-tiempos");
            document.getElementById("contador").innerText = tiemposRegistrados.length;
            
            if (tiemposRegistrados.length === 0) {
                contenedor.innerHTML = '<div class="text-center text-gray-500 italic mt-4">No hay tiempos marcados aún.</div>';
                return;
            }
            
            contenedor.innerHTML = tiemposRegistrados.map((tiempo, index) => {
                const nroOrden = tiemposRegistrados.length - index;
                return `<div class="flex justify-between bg-gray-700 px-3 py-1.5 rounded border-l-4 border-blue-500 font-semibold shadow-sm">
                            <span class="text-gray-400">#${nroOrden} Orden de llegada</span>
                            <span class="text-white">${tiempo}</span>
                        </div>`;
            }).join('');
        }

        function sincronizarConSheet() {
            if (tiemposRegistrados.length === 0) {
                alert("Primero debés registrar algunas llegadas.");
                return;
            }
            
            const btn = document.getElementById("btn-sincro");
            btn.disabled = true;
            btn.innerText = "⏳ ENVIANDO DATOS...";

            const listaCronologica = [...tiemposRegistrados].reverse();

            fetch(URL_WEB_APP, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    accion: "registrar_tiempos",
                    listaTiempos: listaCronologica
                })
            }).then(() => {
                alert("¡Sincronización exitosa! Los tiempos ya están guardados en tu Google Sheet.");
                btn.disabled = false;
                btn.innerHTML = "🔄 SINCRONIZAR CON GOOGLE SHEET";
            }).catch(err => {
                alert("Error de conexión: " + err);
                btn.disabled = false;
                btn.innerHTML = "🔄 SINCRONIZAR CON GOOGLE SHEET";
            });
        }

        function limpiarLocal() {
            if (confirm("¿Seguro que querés vaciar la lista del celular?")) {
                tiemposRegistrados = [];
                horaInicioLocal = null;
                document.getElementById("btn-inicio").disabled = false;
                document.getElementById("btn-inicio").classList.remove("opacity-50", "cursor-not-allowed");
                document.getElementById("btn-llegada").disabled = true;
                document.getElementById("status-inicio").innerText = "Carrera no iniciada";
                document.getElementById("status-inicio").className = "mt-2 text-sm text-gray-400 italic";
                renderizarListaLocal();
            }
        }
    </script>
</body>
</html>
